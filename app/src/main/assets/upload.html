<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电视媒体库</title>
<style>body{background:#101820;color:#eef6ff;font:16px system-ui;max-width:760px;margin:32px auto;padding:20px}h1{font-size:28px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #567;background:#203340;color:white;margin:4px}button{cursor:pointer}button:focus{outline:3px solid #52d3bc}progress{width:100%;height:24px}li{padding:12px;border-bottom:1px solid #456;overflow-wrap:anywhere}.muted{color:#abc}#status{white-space:pre-wrap}</style>
<h1>电视媒体库</h1><p class="muted">与电视连接同一 WiFi 或有线局域网，输入电视上显示的上传 PIN。HTTP 明文传输，请仅在可信局域网使用。</p>
<label>上传 PIN <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></label><button id="login">连接 / 刷新</button>
<p><input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.mp4,.m4v,.mkv,.webm"><button id="upload">上传所选文件</button></p>
<p class="muted">逐个流式上传，单文件最大 16 GiB；浏览器请保持前台。MP4/H.264 兼容性最佳。</p><progress id="progress" value="0" max="100"></progress><p id="status" role="status">等待连接</p><button id="refresh">重新扫描媒体库</button><ul id="list"></ul>
<script>
const $=id=>document.getElementById(id);let busy=false;
async function api(path,method='GET'){const r=await fetch(path,{method,headers:{'X-PIN':$('pin').value}});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function load(){try{const j=await api('/api/files');$('list').replaceChildren();j.files.forEach(f=>{const li=document.createElement('li');const text=document.createElement('span');text.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MiB ';li.append(text);const b=document.createElement('button');b.textContent='删除';b.onclick=async()=>{if(!confirm('删除 '+f.name+'？'))return;try{await api('/api/file?id='+encodeURIComponent(f.id),'DELETE');await load()}catch(e){$('status').textContent=e.message}};li.append(b);$('list').append(li)});$('status').textContent='剩余 '+(j.free/1073741824).toFixed(2)+' GiB · '+j.status}catch(e){$('status').textContent=e.message}}
$('login').onclick=load;$('refresh').onclick=async()=>{try{await api('/api/refresh','POST');await load()}catch(e){$('status').textContent=e.message}};
function send(f,index,total){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST','/api/upload?name='+encodeURIComponent(f.name));x.setRequestHeader('X-PIN',$('pin').value);x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=100*e.loaded/e.total;$('status').textContent=`上传 ${index}/${total}：${f.name} (${Math.round(100*e.loaded/(e.total||1))}%)`};x.onload=()=>{if(x.status===200)resolve();else{try{reject(Error(JSON.parse(x.responseText).error))}catch(e){reject(Error('上传失败 '+x.status))}}};x.onerror=()=>reject(Error('网络中断，请检查电视地址并重试'));x.send(f)})}
$('upload').onclick=async()=>{if(busy)return;const files=Array.from($('files').files);if(!files.length)return;$('upload').disabled=true;busy=true;try{for(let i=0;i<files.length;i++)await send(files[i],i+1,files.length);$('files').value='';await load();$('status').textContent='全部上传完成，电视媒体库已更新'}catch(e){$('status').textContent=e.message}finally{busy=false;$('upload').disabled=false}};
</script></html>
